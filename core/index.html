<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FastWeb AI Chat</title>
    <!-- Подключаем библиотеку для Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --chat-bg: #1e1e1e;
            --header-bg: #252526;
            --border-color: #333;
            --text-color: #ddd;
            --user-bg: #0e639c;
            --bot-bg: #2d2d2d;
            --input-bg: #1e1e1e;
            --btn-bg: #0e639c;
            --btn-clear: #d13438;
        }
        body.light-theme {
            --bg-color: #f5f5f5;
            --chat-bg: #ffffff;
            --header-bg: #e0e0e0;
            --border-color: #ccc;
            --text-color: #333;
            --user-bg: #0078d4;
            --bot-bg: #f0f0f0;
            --input-bg: #ffffff;
            --btn-bg: #0078d4;
            --btn-clear: #d13438;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; transition: background 0.3s; }
        
                #header { 
            background: var(--header-bg); 
            padding: 10px 20px; 
            display: flex; 
            flex-wrap: wrap; /* Разрешаем перенос, если не влезает */
            gap: 15px; 
            justify-content: space-between; 
            align-items: flex-end; /* Выравниваем по низу */
            border-bottom: 1px solid var(--border-color); 
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .control-group label {
            font-size: 0.7em;
            color: #888;
            margin-left: 2px;
        }
        .control-group input[type="number"], 
        .control-group select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
        }
        .controls-row { display: flex; gap: 10px; align-items: center; }
        button.header-btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; height: 30px; }
        #header h2 { margin: 0; font-size: 1.2rem; }
        
        #controls { display: flex; gap: 10px; align-items: center; }
        button.header-btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; }
        #btn-clear { background: var(--btn-clear); }
        #theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 4px; background: var(--chat-bg); }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; line-height: 1.3; }
        .user { background: var(--user-bg); color: white; align-self: flex-end; white-space: pre-wrap; }
        .bot { background: var(--bot-bg); align-self: flex-start; border: 1px solid var(--border-color); }
        .cost { 
            align-self: flex-start;
            color: #888; 
            font-weight: bold;
            font-size: 0.9em; /* Чуть увеличили для эмодзи */
            margin-top: 2px; 
            margin-bottom: 10px; 
            padding-left: 10px; 
            display: flex;
            align-items: center;
            gap: 5px; /* Отступ между эмодзи и цифрой */
        }
        
        /* Стили для Markdown внутри .bot */
        .bot h1, .bot h2, .bot h3, .bot h4 { 
            margin-top: 10px; 
            margin-bottom: 5px; 
            font-size: 1.1em; /* Делаем заголовки чуть больше обычного текста, но не огромными */
            color: var(--text-color); 
        }
        
        .bot p { 
            margin: 5px 0; 
            font-size: 1em; /* Обычный размер шрифта */
            line-height: 1.4;
        }
        
        .bot ul, .bot ol { 
            padding-left: 20px; 
            margin: 5px 0; 
        }
        
        .bot li { 
            margin-bottom: 4px; 
        }
        /* Стили для inline-кода (одинарные кавычки) */
        .bot code { 
            background: #3e3e3e;  /* Более светлый фон */
            color: #ce9178;       /* Оранжевый цвет текста как в VS Code */
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: monospace; 
            font-size: 0.9em;
        }
        
        /* Стили для блочного кода (тройные кавычки) */
        .bot pre { 
            background: #1e1e1e; 
            border: 1px solid #333;
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto; 
        }
        .bot pre code {
            background: transparent; /* Убираем фон у кода внутри блока */
            color: #d4d4d4;          /* Возвращаем светлый цвет */
            padding: 0;
        }
        
        .bot.status { color: #888; font-style: italic; border: none; background: transparent; padding: 5px 15px; }
        .action { align-self: flex-start; color: #569cd6; font-style: italic; font-size: 0.85em; padding-left: 10px; }
        .result { align-self: flex-start; color: #6a9955; font-size: 0.85em; font-family: monospace; padding-left: 10px; white-space: pre-wrap;}
        
        #input-area { display: flex; padding: 15px; background: var(--header-bg); border-top: 1px solid var(--border-color); gap: 10px; align-items: flex-end; }
        textarea { 
            flex: 1; padding: 10px; border-radius: 5px; border: 1px solid var(--border-color); 
            background: var(--input-bg); color: var(--text-color); resize: none; 
            font-family: inherit; font-size: inherit; max-height: 150px; overflow-y: auto;
        }
        button#send { padding: 10px 20px; background: var(--btn-bg); color: white; border: none; border-radius: 5px; cursor: pointer; height: 40px; }
        button#send:hover { filter: brightness(1.2); }
        button#send:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="header">
        <h2 style="margin: 0; align-self: center;">FastWeb AI Agent</h2>
        
        <div class="controls-row">
            <div class="control-group">
                <label>Модель</label>
                <select id="model-select">
                    <option value="deepseek-flash">flash (быстро, дешево)</option>
                    <option value="deepseek-v4-pro">v4-pro (умно, дорого)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Max Tokens</label>
                <input type="number" id="max-tokens" value="500" min="10" max="8000" style="width: 80px;">
            </div>

            <div class="control-group">
                <label>Max Steps</label>
                <input type="number" id="max-steps" value="8" min="1" max="50" style="width: 60px;">
            </div>

            <div class="control-group">
                <label>Max Tools (за шаг)</label>
                <input type="number" id="max-tool-calls" value="10" min="1" max="50" style="width: 60px;">
            </div>

            <div class="control-group">
                <label>Бюджет (USD)</label>
                <input type="number" id="max-budget" value="0.02" step="0.01" min="0.01" style="width: 70px;">
            </div>

            <div class="control-group">
                <label>Думать</label>
                <select id="thinking-select">
                    <option value="false">Выкл</option>
                    <option value="true">Вкл</option>
                </select>
            </div>

            <div class="control-group">
                <label>Валидация</label>
                <select id="validate-toggle">
                    <option value="true">Вкл</option>
                    <option value="false">Выкл</option>
                </select>
            </div>
        </div>

        <div class="controls-row">
            <button id="btn-clear" class="header-btn" style="background: var(--btn-clear);">Очистить</button>
            <button id="theme-toggle" title="Сменить тему" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0;">🌙</button>
        </div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <textarea id="prompt" placeholder="Напишите команду... (Enter — отправить)" rows="1"></textarea>
        <button id="send">Отправить</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const themeToggle = document.getElementById('theme-toggle');
        const btnClear = document.getElementById('btn-clear');
        
        let history = [];

        // --- Тема ---
        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            document.body.classList.add('light-theme');
            themeToggle.textContent = '☀️';
        }
        themeToggle.onclick = () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        };

        // --- Очистка чата ---
        btnClear.onclick = () => {
            if (confirm("Очистить историю диалога?")) {
                history = [];
                chat.innerHTML = '';
            }
        };

        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMsg(text, type, isMarkdown = false) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            
            // Если это результат действия, разрешаем HTML (для <br>)
            if (type === 'result') {
                div.innerHTML = text; 
            } else if (isMarkdown) {
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            promptInput.value = '';
            promptInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            addMsg(text, 'user');
            history.push({ role: "user", content: text });

            const botMsgDiv = addMsg("Думаю...", 'bot status');
            let fullResponse = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text, 
                        history: history,
                        model_name: document.getElementById('model-select').value,
                        max_tokens: parseInt(document.getElementById('max-tokens').value) || 500,
                        max_steps: parseInt(document.getElementById('max-steps').value) || 8,
                        max_tool_calls: parseInt(document.getElementById('max-tool-calls').value) || 10,
                        max_budget_usd: parseFloat(document.getElementById('max-budget').value) || 0.02,
                        thinking_enabled: document.getElementById('thinking-select').value === 'true',
                        enable_validation: document.getElementById('validate-toggle').value === 'true'
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (!data) continue;

                        if (data.startsWith('[STATUS] ')) {
                            botMsgDiv.textContent = data.slice(9);
                            continue;
                        }

                        if (data.startsWith('[ACTION] ')) {
                            if (botMsgDiv.classList.contains('status')) botMsgDiv.remove();
                            addMsg(data.slice(9), 'action');
                            continue;
                        }

                        if (data.startsWith('[RESULT] ')) {
                            addMsg(data.slice(9), 'result');
                            continue;
                        }

                        if (data.startsWith('[COST] ')) {
                            if (botMsgDiv.classList.contains('status')) botMsgDiv.remove();
                            addMsg(data.slice(7), 'cost');
                            continue;
                        }

                        if (botMsgDiv.classList.contains('status')) {
                            botMsgDiv.classList.remove('status');
                        }
                        fullResponse += data;
                        // ОБНОВЛЯЕМ MARKDOWN НА ЛЕТУ
                        botMsgDiv.innerHTML = marked.parse(fullResponse);
                        chat.scrollTop = chat.scrollHeight;
                    }
                }
                
                history.push({ role: "assistant", content: fullResponse || "Готово" });

            } catch (err) {
                botMsgDiv.textContent = "Ошибка: " + err.message;
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        sendBtn.onclick = sendMessage;
    </script>
</body>
</html>
