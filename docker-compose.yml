services:
  agent:
    build: .
    container_name: deepseek-agent
    volumes:
      - ./workspace:/app/workspace
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    networks:
      - agent-net
    ports:
      - "8000:8000"
    user: "1000:1000"

networks:
  agent-net:
    driver: bridge