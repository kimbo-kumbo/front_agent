services:
  agent:
    build: .
    container_name: deepseek-agent
    volumes:
      - ./workspace:/app/workspace
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    env_file:
      - .env
    networks:
      - agent-net
    ports:
      - "8000:8000"
    user: "1000:1000"
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - agent-net


networks:
  agent-net:
    driver: bridge